<!doctype html>
<!-- App demo: a desktop AI app window that feels real. The cursor drags clip files in,
     they attach as file chips, "/video-edit" is typed with a skill suggestion, the
     message sends, and the assistant runs the skill with ticking steps and progress.
     Use when the speaker describes the workflow ("drop in your clips, trigger the
     skill"). The product name and logo are real; the layout is generic, not a copy. -->
<html data-composition-variables='[
  {"id":"appName","type":"string","label":"App name","default":"Claude Code"},
  {"id":"src","type":"string","label":"Logo file in this folder (optional)","default":""},
  {"id":"user","type":"string","label":"User name in the sidebar","default":"You"},
  {"id":"project","type":"string","label":"Project folder chip","default":"~/Videos/launch-reel"},
  {"id":"heading","type":"string","label":"Empty-state heading","default":"What are we making today?"},
  {"id":"command","type":"string","label":"Typed command","default":"/video-edit"},
  {"id":"skillHint","type":"string","label":"Skill description in the suggestion","default":"Edit raw clips into a finished video"},
  {"id":"steps","type":"string","label":"Progress steps, separated by |","default":"Transcribing 4 clips|Picking the best takes|Captions and motion graphics|Rendering final cut"},
  {"id":"recents","type":"string","label":"Sidebar recents, separated by |","default":"Launch reel edit|Podcast clips to shorts|Course promo v2|Thumbnail ideas|Weekly vlog cut"},
  {"id":"files","type":"string","label":"Thumbnail files in this folder, comma separated","default":""},
  {"id":"accent","type":"color","label":"Accent","default":"#d97757"}
]'>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; }
  #root { position: relative; overflow: hidden; font-family: -apple-system, "SF Pro Text", "Helvetica Neue", Arial, sans-serif; color: #1f1e1d; }
  .win { position: absolute; border-radius: 14px; overflow: hidden; background: #faf9f5; opacity: 0;
         box-shadow: 0 30px 80px rgba(0,0,0,.45), 0 0 0 1px rgba(0,0,0,.12); }
  .titlebar { position: absolute; left: 0; right: 0; top: 0; display: flex; align-items: center; background: #ece9e1; border-bottom: 1px solid #ddd8cc; }
  .lights { display: flex; }
  .light { border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0,0,0,.12); }
  .ttl { position: absolute; left: 0; right: 0; text-align: center; color: #57534e; font-weight: 600; pointer-events: none; }
  .side { position: absolute; left: 0; bottom: 0; background: #f2efe7; border-right: 1px solid #e3ded2; box-sizing: border-box; }
  .brand { display: flex; align-items: center; font-weight: 700; }
  .brand img, .avatar-logo { object-fit: contain; }
  .newbtn { display: flex; align-items: center; border-radius: 9px; background: #fff; border: 1px solid #e3ded2; font-weight: 600; }
  .search { border-radius: 8px; background: #e9e5db; color: #8a847a; }
  .sect { color: #8a847a; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
  .recent { border-radius: 7px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #44403c; }
  .recent.on { background: #e6e1d6; color: #1f1e1d; font-weight: 600; }
  .me { position: absolute; left: 0; right: 0; bottom: 0; display: flex; align-items: center; border-top: 1px solid #e3ded2; }
  .av { border-radius: 50%; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; }
  .main { position: absolute; right: 0; bottom: 0; }
  .topbar { position: absolute; left: 0; right: 0; top: 0; display: flex; align-items: center; justify-content: space-between; }
  .chip { display: inline-flex; align-items: center; border-radius: 999px; border: 1px solid #e3ded2; background: #fff; color: #57534e; font-weight: 600; }
  .empty { position: absolute; left: 0; right: 0; text-align: center; }
  .empty h1 { margin: 0; font-weight: 500; font-family: Georgia, "Times New Roman", serif; letter-spacing: -.01em; }
  .composer { position: absolute; border-radius: 16px; background: #fff; border: 1px solid #ddd8cc; box-shadow: 0 4px 16px rgba(0,0,0,.06); box-sizing: border-box; }
  .att { display: flex; flex-wrap: nowrap; overflow: hidden; }
  .file { display: flex; align-items: center; border: 1px solid #e3ded2; border-radius: 10px; background: #faf9f5; opacity: 0; flex: none; }
  .thumb { border-radius: 6px; background: #ccc center/cover; flex: none; }
  .fname { font-weight: 600; line-height: 1.15; }
  .fsize { color: #8a847a; font-weight: 500; }
  .typed { font-family: "SF Mono", Menlo, monospace; font-weight: 600; color: #1f1e1d; }
  .placeholder { color: #a8a29e; }
  .row { position: absolute; left: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: space-between; }
  .plus, .send { border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; }
  .plus { border: 1px solid #ddd8cc; color: #57534e; }
  .send { color: #fff; }
  .suggest { position: absolute; border-radius: 12px; background: #fff; border: 1px solid #ddd8cc; box-shadow: 0 12px 30px rgba(0,0,0,.14); opacity: 0; }
  .sg { display: flex; align-items: center; border-radius: 8px; }
  .sg b { font-family: "SF Mono", Menlo, monospace; }
  .convo { position: absolute; opacity: 0; }
  .bubble { margin-left: auto; border-radius: 16px; background: #ece9e1; width: fit-content; }
  .bubble .typed { display: block; }
  .asst { display: flex; align-items: flex-start; }
  .alogo { border-radius: 8px; flex: none; display: flex; align-items: center; justify-content: center; }
  .using { display: inline-flex; align-items: center; border-radius: 8px; border: 1px solid #e3ded2; background: #fff; font-weight: 600; color: #57534e; }
  .spin { border-radius: 50%; border-style: solid; border-color: #e3ded2; animation: none; }
  .step { display: flex; align-items: center; opacity: 0; color: #44403c; }
  .tick { border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; flex: none; }
  .prog { border-radius: 999px; background: #ece9e1; overflow: hidden; opacity: 0; }
  .prog i { display: block; height: 100%; width: 0; }
  .drop { position: absolute; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-weight: 700; opacity: 0; }
  .ghost { position: absolute; left: 0; top: 0; opacity: 0; }
  .ghost .g { position: absolute; border-radius: 10px; background: #fff; box-shadow: 0 10px 26px rgba(0,0,0,.3); display: flex; flex-direction: column; overflow: hidden; }
  .ghost .g .thumb { border-radius: 0; flex: 1; }
  .ghost .g span { font-weight: 600; text-align: center; }
  .badge { position: absolute; border-radius: 999px; color: #fff; font-weight: 800; display: flex; align-items: center; justify-content: center; }
  .cursor { position: absolute; left: 0; top: 0; opacity: 0; filter: drop-shadow(0 3px 5px rgba(0,0,0,.35)); }
</style>
</head>
<body>
<div id="root" data-composition-id="root" data-width="{{WIDTH}}" data-height="{{HEIGHT}}" data-start="0" data-duration="{{DURATION}}">
  <div id="cam" style="position:absolute;left:0;top:0;width:100%;height:100%;transform-origin:0 0">
  <div class="win clip" id="win" data-start="0" data-duration="{{DURATION}}"></div>
  <div class="ghost" id="ghost"></div>
  <svg class="cursor" id="cursor" viewBox="0 0 24 24"><path d="M4 2l16 9-7 1.6L9.6 20z" fill="#111" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
  <script>
    const v = window.__hyperframes.getVariables();
    const W = {{WIDTH}}, H = {{HEIGHT}}, D = {{DURATION}};
    const el = (tag, cls, css, parent, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (css) Object.assign(e.style, css); if (html !== undefined) e.innerHTML = html; (parent || document.body).appendChild(e); return e; };
    const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
    const px = n => n + "px";

    // Window geometry: wide, slightly letterboxed, like a laptop screenshot.
    const ww = W * 0.94, wh = Math.min(H * 0.9, ww * 0.72);
    const wx = (W - ww) / 2, wy = (H - wh) / 2;
    const u = ww / 100; // one unit = 1% of window width
    const win = document.getElementById("win");
    Object.assign(win.style, { left: px(wx), top: px(wy), width: px(ww), height: px(wh) });

    const logo = v.src ? `<img src="${v.src}" style="width:${2.6 * u}px;height:${2.6 * u}px">` : `<span style="width:${2.6 * u}px;height:${2.6 * u}px;border-radius:6px;background:${v.accent};display:inline-block"></span>`;

    // Title bar with real window controls.
    const tbH = 4.4 * u;
    const tb = el("div", "titlebar", { height: px(tbH), paddingLeft: px(1.6 * u) }, win);
    const lights = el("div", "lights", { gap: px(0.8 * u) }, tb);
    ["#ff5f57", "#febc2e", "#28c840"].forEach(c => el("span", "light", { width: px(1.3 * u), height: px(1.3 * u), background: c }, lights));
    el("div", "ttl", { fontSize: px(1.35 * u) }, tb, `${esc(v.appName)} — ${esc(v.project.split("/").pop())}`);

    // Sidebar.
    const sideW = 22 * u;
    const side = el("div", "side", { top: px(tbH), width: px(sideW), padding: px(1.4 * u) }, win);
    el("div", "brand", { gap: px(0.8 * u), fontSize: px(1.6 * u), marginBottom: px(1.4 * u) }, side, `${logo}<span>${esc(v.appName)}</span>`);
    el("div", "newbtn", { gap: px(0.6 * u), padding: `${0.8 * u}px ${1 * u}px`, fontSize: px(1.3 * u), marginBottom: px(1 * u) }, side, `<span style="color:${v.accent};font-size:${1.6 * u}px;line-height:1">+</span> New session`);
    el("div", "search", { padding: `${0.6 * u}px ${1 * u}px`, fontSize: px(1.2 * u), marginBottom: px(1.6 * u) }, side, "⌕&nbsp; Search");
    el("div", "sect", { fontSize: px(0.95 * u), marginBottom: px(0.7 * u) }, side, "Recents");
    v.recents.split("|").forEach((r, i) => el("div", "recent" + (i === 0 ? " on" : ""), { padding: `${0.55 * u}px ${0.8 * u}px`, fontSize: px(1.2 * u), marginBottom: px(0.3 * u) }, side, esc(r)));
    const me = el("div", "me", { padding: px(1.2 * u), gap: px(0.8 * u), fontSize: px(1.25 * u) }, side);
    el("div", "av", { width: px(2.4 * u), height: px(2.4 * u), background: "#6b7280", fontSize: px(1.1 * u) }, me, esc(v.user.slice(0, 1).toUpperCase()));
    el("div", "", { fontWeight: 600 }, me, esc(v.user));

    // Main pane.
    const mainW = ww - sideW;
    const main = el("div", "main", { top: px(tbH), width: px(mainW) }, win);
    const topBar = el("div", "topbar", { padding: `${1 * u}px ${1.6 * u}px`, fontSize: px(1.15 * u) }, main);
    el("span", "chip", { padding: `${0.4 * u}px ${0.9 * u}px`, gap: px(0.5 * u) }, topBar, `📁 ${esc(v.project)}`);
    el("span", "chip", { padding: `${0.4 * u}px ${0.9 * u}px` }, topBar, "Share");

    const mainH = wh - tbH;
    const empty = el("div", "empty", { top: px(mainH * 0.2) }, main);
    el("div", "", { marginBottom: px(1 * u) }, empty, v.src ? `<img src="${v.src}" style="width:${4 * u}px;height:${4 * u}px;object-fit:contain">` : "");
    el("h1", "", { fontSize: px(2.8 * u) }, empty, esc(v.heading));

    const cmpW = mainW * 0.82, cmpX = (mainW - cmpW) / 2;
    const composer = el("div", "composer", { left: px(cmpX), width: px(cmpW), bottom: px(mainH * 0.08), height: px(mainH * 0.3), padding: px(1.2 * u) }, main);
    const att = el("div", "att", { gap: px(0.8 * u), height: px(4.4 * u), marginBottom: px(0.8 * u) }, composer);
    const files = (v.files || "").split(",").map(s => s.trim()).filter(Boolean);
    const thumbs = (files.length ? files : [null, null, null, null]).slice(0, 4);
    const names = thumbs.map((_, i) => `clip_0${i + 1}.mov`);
    const sizes = ["84 MB", "61 MB", "72 MB", "55 MB"];
    thumbs.forEach((f, i) => {
      const fe = el("div", "file", { padding: px(0.5 * u), gap: px(0.6 * u), height: "100%", boxSizing: "border-box" }, att);
      el("div", "thumb", { width: px(2.2 * u), height: "100%", backgroundImage: f ? `url(${f})` : "none" }, fe);
      el("div", "", {}, fe, `<div class="fname" style="font-size:${1.1 * u}px">${names[i]}</div><div class="fsize" style="font-size:${0.95 * u}px">${sizes[i]}</div>`);
    });
    const line = el("div", "", { fontSize: px(1.45 * u) }, composer);
    const placeholder = el("span", "placeholder", {}, line, `Reply to ${esc(v.appName.split(" ")[0])}…`);
    const typed = el("span", "typed", {}, line, "");
    const row = el("div", "row", { padding: px(1 * u) }, composer);
    const left = el("div", "", { display: "flex", alignItems: "center", gap: px(0.7 * u) }, row);
    el("span", "plus", { width: px(2.6 * u), height: px(2.6 * u), fontSize: px(1.6 * u) }, left, "+");
    el("span", "chip", { padding: `${0.35 * u}px ${0.8 * u}px`, fontSize: px(1.05 * u) }, left, "⚡ Skills");
    const send = el("span", "send", { width: px(2.8 * u), height: px(2.8 * u), background: "#cfc9bd", fontSize: px(1.5 * u) }, row, "↑");

    // Skill suggestion popover above the composer.
    const suggest = el("div", "suggest", { left: px(cmpX), width: px(cmpW * 0.7), bottom: px(mainH * 0.08 + mainH * 0.3 + 0.8 * u), padding: px(0.6 * u) }, main);
    el("div", "sg", { padding: `${0.7 * u}px ${0.9 * u}px`, gap: px(1 * u), background: "#f2efe7", fontSize: px(1.2 * u) }, suggest, `<b>${esc(v.command)}</b><span style="color:#78716c">${esc(v.skillHint)}</span>`);
    el("div", "sg", { padding: `${0.7 * u}px ${0.9 * u}px`, gap: px(1 * u), fontSize: px(1.2 * u), color: "#a8a29e" }, suggest, `<b>/video-captions</b><span>Caption an existing video</span>`);

    // Drop overlay.
    const drop = el("div", "drop", { left: px(cmpX - u), width: px(cmpW + 2 * u), bottom: px(mainH * 0.08 - u), height: px(mainH * 0.3 + 2 * u), border: `${0.3 * u}px dashed ${v.accent}`, background: v.accent + "18", color: v.accent, fontSize: px(1.6 * u) }, main, "Drop files to attach");

    // Conversation after sending.
    const convo = el("div", "convo", { left: px(mainW * 0.08), right: px(mainW * 0.08), top: px(mainH * 0.11) }, main);
    const bubble = el("div", "bubble", { padding: `${1 * u}px ${1.3 * u}px`, marginBottom: px(1.6 * u) }, convo);
    el("span", "typed", { fontSize: px(1.4 * u) }, bubble, esc(v.command));
    el("div", "", { fontSize: px(1.05 * u), color: "#78716c", marginTop: px(0.4 * u) }, bubble, `${thumbs.length} attachments`);
    const asst = el("div", "asst", { gap: px(1 * u) }, convo);
    el("div", "alogo", { width: px(3 * u), height: px(3 * u) }, asst, logo);
    const acol = el("div", "", { flex: 1 }, asst);
    el("div", "using", { padding: `${0.5 * u}px ${0.9 * u}px`, gap: px(0.6 * u), fontSize: px(1.15 * u), marginBottom: px(1.1 * u) }, acol, `<span style="color:${v.accent}">⚡</span> Using skill <b style="color:#1f1e1d">${esc(v.command.replace("/", ""))}</b>`);
    v.steps.split("|").forEach(s => {
      const st = el("div", "step", { gap: px(0.9 * u), fontSize: px(1.35 * u), marginBottom: px(0.8 * u) }, acol);
      el("span", "tick", { width: px(2 * u), height: px(2 * u), background: v.accent, fontSize: px(1.1 * u) }, st, "✓");
      el("span", "", {}, st, esc(s));
    });
    const prog = el("div", "prog", { height: px(0.7 * u), marginTop: px(0.6 * u) }, acol);
    el("i", "", { background: v.accent }, prog);

    // Dragged files: a stack of file cards with a count badge, like a Finder drag.
    const ghost = document.getElementById("ghost");
    const gw = 7 * u, gh = 10 * u;
    thumbs.slice(0, 3).forEach((f, i) => {
      const g = el("div", "g", { width: px(gw), height: px(gh), left: px(i * 1.2 * u), top: px(i * 0.6 * u), transform: `rotate(${(i - 1) * 6}deg)` }, ghost);
      el("div", "thumb", { backgroundImage: f ? `url(${f})` : "none" }, g);
      el("span", "", { fontSize: px(0.9 * u), padding: px(0.3 * u) }, g, names[i]);
    });
    el("div", "badge", { left: px(gw + 1.4 * u), top: px(-1 * u), width: px(2.6 * u), height: px(2.6 * u), background: "#ef4444", fontSize: px(1.2 * u) }, ghost, String(thumbs.length));

    const cursor = document.getElementById("cursor");
    cursor.style.width = px(2.6 * u);
    const winX = wx + sideW, winY = wy + tbH;
    const dropPt = { x: winX + mainW * 0.5, y: winY + mainH * 0.7 };
    const sendPt = { x: winX + cmpX + cmpW - 2.4 * u, y: winY + mainH * 0.92 - 2 * u };
    const startPt = { x: W * 0.02, y: H * 0.98 };

    const tl = gsap.timeline({ paused: true });
    const k = D / 5; // choreography written for 5 s; scales with duration
    tl.set(".tick", { scale: 0 }, 0);
    tl.fromTo(win, { opacity: 0, y: 30, scale: 0.97 }, { opacity: 1, y: 0, scale: 1, duration: 0.3, ease: "power3.out" }, 0);
    tl.set([cursor, ghost], { opacity: 1, x: startPt.x, y: startPt.y }, 0.25 * k);
    tl.to([cursor, ghost], { x: dropPt.x, y: dropPt.y - gh * 0.4, duration: 0.85 * k, ease: "power2.inOut" }, 0.3 * k);
    tl.to(drop, { opacity: 1, duration: 0.15 * k }, 0.75 * k);
    tl.to(ghost, { scale: 0.3, opacity: 0, duration: 0.2 * k }, 1.18 * k);
    tl.to(drop, { opacity: 0, duration: 0.15 * k }, 1.22 * k);
    tl.to(".file", { opacity: 1, duration: 0.15 * k, stagger: 0.06 * k }, 1.22 * k);
    tl.to(empty, { opacity: 0.25, duration: 0.25 * k }, 1.3 * k);
    tl.set(placeholder, { display: "none" }, 1.5 * k);
    const typer = { n: 0 };
    tl.to(typer, { n: v.command.length, duration: 0.55 * k, ease: "none", onUpdate: () => { typed.textContent = v.command.slice(0, Math.round(typer.n)); } }, 1.5 * k);
    tl.to(suggest, { opacity: 1, y: -4, duration: 0.15 * k }, 1.62 * k);
    tl.to(send, { backgroundColor: v.accent, duration: 0.1 * k }, 1.9 * k);
    tl.to(cursor, { x: sendPt.x, y: sendPt.y, duration: 0.35 * k, ease: "power2.inOut" }, 1.95 * k);
    tl.to(cursor, { scale: 0.82, duration: 0.05 * k, yoyo: true, repeat: 1 }, 2.32 * k);
    tl.to([composer, empty, suggest], { opacity: 0, duration: 0.18 * k }, 2.42 * k);
    tl.to(cursor, { opacity: 0, duration: 0.15 * k }, 2.5 * k);
    tl.fromTo(convo, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.22 * k }, 2.45 * k);
    tl.to(".step", { opacity: 1, duration: 0.16 * k, stagger: 0.38 * k }, 2.7 * k);
    tl.to(".tick", { scale: 1, duration: 0.22 * k, ease: "back.out(2.5)", stagger: 0.38 * k }, 2.85 * k);
    tl.to(prog, { opacity: 1, duration: 0.15 * k }, 2.75 * k);
    tl.to(".prog i", { width: "100%", duration: Math.max(0.4, D - 2.9 * k), ease: "power1.inOut" }, 2.8 * k);
    // Camera: overview while files are dragged in, then follow the action so the
    // text is readable on a phone (composer while typing, then the running steps).
    const cam = document.getElementById("cam");
    const focus = (fx, fy, s) => ({ scale: s, x: W / 2 - fx * s, y: H / 2 - fy * s });
    const composerC = { x: winX + cmpX + cmpW * 0.5, y: winY + mainH * 0.8 };
    const convoC = { x: winX + mainW * 0.5, y: winY + mainH * 0.33 };
    tl.set(cam, focus(W / 2, H / 2, 1), 0);
    tl.to(cam, { ...focus(composerC.x, composerC.y - 3 * u, 1.55), duration: 0.32 * k, ease: "power2.inOut" }, 1.28 * k);
    tl.to(cam, { ...focus(convoC.x, convoC.y, 1.5), duration: 0.32 * k, ease: "power2.inOut" }, 2.42 * k);
    window.__timelines = window.__timelines || {};
    window.__timelines["root"] = tl;
  </script>
</div>
</body>
</html>
