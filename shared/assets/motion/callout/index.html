<!doctype html>
<!-- Callout: the thing the speaker promises is on screen ("the link is on the screen"),
     held for as long as they talk about it. -->
<html data-composition-variables='[
  {"id":"eyebrow","type":"string","label":"Eyebrow","default":"LINK"},
  {"id":"text","type":"string","label":"Text","default":"example.com/start"},
  {"id":"accent","type":"color","label":"Accent","default":"#22c55e"},
  {"id":"ink","type":"color","label":"Text","default":"#0f172a"},
  {"id":"panel","type":"color","label":"Panel","default":"#ffffff"},
  {"id":"font","type":"string","label":"Font","default":"Inter, Arial, sans-serif"},
  {"id":"top","type":"number","label":"Top px","default":260}
]'>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; }
  #root { position: relative; overflow: hidden; }
  .pill { position: absolute; left: 50%; transform: translateX(-50%); max-width: 84%;
          display: flex; align-items: center; gap: 22px; padding: 22px 34px 22px 22px;
          border-radius: 999px; box-shadow: 0 18px 50px rgba(0,0,0,.28); opacity: 0; white-space: nowrap; }
  .eyebrow { font-size: 30px; font-weight: 800; letter-spacing: 3px; padding: 12px 20px; border-radius: 999px; color: #fff; }
  .text { font-size: 50px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>
<div id="root" data-composition-id="root" data-width="{{WIDTH}}" data-height="{{HEIGHT}}" data-start="0" data-duration="{{DURATION}}">
  <div class="pill clip" id="pill" data-start="0" data-duration="{{DURATION}}">
    <div class="eyebrow" id="eyebrow"></div>
    <div class="text" id="text"></div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
  <script>
    const v = window.__hyperframes.getVariables();
    const pill = document.getElementById("pill");
    pill.style.top = v.top + "px";
    pill.style.background = v.panel;
    pill.style.color = v.ink;
    pill.style.fontFamily = v.font;
    const eyebrow = document.getElementById("eyebrow");
    eyebrow.textContent = v.eyebrow;
    eyebrow.style.background = v.accent;
    document.getElementById("text").textContent = v.text;
    const D = {{DURATION}};
    const tl = gsap.timeline({ paused: true });
    tl.fromTo(pill, { opacity: 0, scale: 0.85, y: 20 }, { opacity: 1, scale: 1, y: 0, duration: 0.4, ease: "back.out(1.8)" }, 0);
    tl.fromTo("#eyebrow", { scale: 0.6 }, { scale: 1, duration: 0.35, ease: "back.out(2.2)" }, 0.12);
    tl.to(pill, { opacity: 0, scale: 0.95, duration: 0.25, ease: "power2.in" }, D - 0.25);
    window.__timelines = window.__timelines || {};
    window.__timelines["root"] = tl;
  </script>
</div>
</body>
</html>
