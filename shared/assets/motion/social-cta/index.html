<!doctype html>
<!-- Social CTA: a phone comment sheet in the style of a short-video app (dark mode).
     Real conventions: grabber, "Comments" title, avatars, usernames with times, like
     counts, Reply links, an emoji quick bar, the "Add a comment" field, and the iOS
     keyboard sliding up while the keyword is typed key by key. The comments are full
     of people asking for the keyword, as on real call-to-action posts. The camera
     follows the action so the text reads on a phone. Generic design; no app logo. -->
<html data-composition-variables='[
  {"id":"keyword","type":"string","label":"Keyword to type","default":"SKILL"},
  {"id":"handle","type":"string","label":"Creator handle (no @)","default":"yourhandle"},
  {"id":"you","type":"string","label":"Viewer username","default":"maya.creates"},
  {"id":"accent","type":"color","label":"Post button colour","default":"#0095f6"},
  {"id":"reply","type":"string","label":"Author reply to the keyword comment","default":"Sent ✅ check your DMs 📩"},
  {"id":"dm","type":"string","label":"DM notification text","default":"Your free skill is here 🎁"}
]'>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; }
  #root { position: relative; overflow: hidden; background: transparent; font-family: -apple-system, "SF Pro Text", "Helvetica Neue", Arial, sans-serif; }
  .frame { position: absolute; left: 4%; right: 4%; top: 4%; bottom: 0; border-radius: 46px 46px 0 0; overflow: hidden; background: #000; opacity: 0;
           box-shadow: 0 30px 80px rgba(0,0,0,.5), 0 0 0 2px #1c1c1e; }
  .screen { position: absolute; left: 0; right: 0; top: 0; color: #f5f5f5; }
  .grab { width: 13%; height: 14px; border-radius: 7px; background: #4a4a4a; margin: 26px auto 22px; }
  .title { text-align: center; font-weight: 700; font-size: 44px; padding-bottom: 26px; border-bottom: 1px solid #262626; }
  .c { display: flex; gap: 30px; padding: 30px 40px 18px; align-items: flex-start; }
  .av { width: 92px; height: 92px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 38px; color: #fff; }
  .body { flex: 1; min-width: 0; }
  .meta { font-size: 33px; color: #a8a8a8; }
  .meta b { color: #f5f5f5; font-weight: 600; margin-right: 12px; }
  .author { color: #a8a8a8; font-size: 30px; margin-left: 10px; }
  .txt { font-size: 40px; line-height: 1.3; margin-top: 4px; }
  .reply { font-size: 32px; color: #a8a8a8; margin-top: 12px; font-weight: 600; }
  .like { width: 70px; text-align: center; color: #a8a8a8; font-size: 30px; flex: none; padding-top: 18px; }
  .like svg { width: 40px; height: 40px; display: block; margin: 0 auto 6px; }
  .new { opacity: 0; height: 0; overflow: hidden; }
  .dock { position: absolute; left: 0; right: 0; background: #000; }
  .emoji { display: flex; justify-content: space-around; font-size: 58px; padding: 22px 30px; border-top: 1px solid #262626; }
  .input { display: flex; align-items: center; gap: 26px; padding: 14px 34px 26px; }
  .field { flex: 1; border: 2px solid #363636; border-radius: 60px; padding: 24px 34px; font-size: 38px; color: #8e8e8e; display: flex; align-items: center; }
  .typed { color: #f5f5f5; font-weight: 600; }
  .caret { width: 4px; height: 46px; background: #0095f6; margin-left: 4px; opacity: 0; }
  .post { font-weight: 700; font-size: 38px; opacity: .35; }
  .kb { position: absolute; left: 0; right: 0; background: #2c2c2e; padding: 18px 10px 40px; box-sizing: border-box; }
  .kr { display: flex; justify-content: center; gap: 14px; margin-bottom: 22px; }
  .k { width: 86px; height: 118px; border-radius: 14px; background: #6b6b6f; color: #fff; font-size: 52px; display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 0 #1c1c1e; position: relative; }
  .k.wide { width: 130px; background: #4a4a4d; font-size: 34px; }
  .k.space { width: 470px; font-size: 36px; }
  .k.ret { width: 200px; background: #0a84ff; font-size: 36px; }
  .pop { position: absolute; left: 50%; bottom: 60%; transform: translateX(-50%); width: 120px; height: 150px; border-radius: 22px 22px 14px 14px;
         background: #8a8a8e; font-size: 72px; display: flex; align-items: flex-start; justify-content: center; padding-top: 16px; box-sizing: border-box; opacity: 0; }
  .replyrow { display: flex; gap: 24px; padding: 6px 40px 18px 162px; align-items: flex-start; opacity: 0; height: 0; overflow: hidden; }
  .replyrow .av { width: 66px; height: 66px; font-size: 28px; }
  .banner { position: absolute; left: 3%; right: 3%; top: 2%; display: flex; gap: 26px; align-items: center; padding: 26px 30px;
            border-radius: 40px; background: rgba(44,44,46,.98); color: #fff; box-shadow: 0 20px 50px rgba(0,0,0,.5); opacity: 0; }
  .banner .av { width: 96px; height: 96px; font-size: 40px; }
  .banner .app { color: #a8a8a8; font-size: 30px; }
  .banner .msg { font-size: 36px; line-height: 1.25; }
</style>
</head>
<body>
<div id="root" data-composition-id="root" data-width="{{WIDTH}}" data-height="{{HEIGHT}}" data-start="0" data-duration="{{DURATION}}">
  <div class="frame clip" id="frame" data-start="0" data-duration="{{DURATION}}">
    <div class="screen" id="screen"></div>
  </div>
  <div class="banner" id="banner"><div class="av" style="background:linear-gradient(135deg,#f58529,#dd2a7b,#8134af)" id="bav"></div>
    <div><div class="app" id="bapp"></div><div class="msg" id="bmsg"></div></div></div>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
  <script>
    const v = window.__hyperframes.getVariables();
    const W = {{WIDTH}}, H = {{HEIGHT}}, D = {{DURATION}};
    const KW = String(v.keyword).toUpperCase();
    const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
    const heartSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7.5-4.6-9.6-9.1C.9 8.6 3 5 6.5 5c2 0 3.6 1.1 4.5 2.6C11.9 6.1 13.5 5 15.5 5 19 5 21.1 8.6 19.6 11.9 17.5 16.4 12 21 12 21z"/></svg>';
    const people = [
      ["jordan.makes", "#f59e0b", "1h", `${KW} 🙏`, "212"],
      ["priya.films", "#ec4899", "54m", `${KW.toLowerCase()} please!! this is exactly what I needed`, "96"],
      ["devon_edits", "#10b981", "41m", `wait it does the captions too?? ${KW}`, "58"],
      ["sam.creates", "#8b5cf6", "22m", KW, "31"],
      ["lena.vlogs", "#06b6d4", "9m", `need this ${KW} 🔥`, "14"],
    ];
    const row = (name, color, time, text, likes, extra = "") =>
      `<div class="c ${extra}"><div class="av" style="background:${color}">${esc(name[0].toUpperCase())}</div>
        <div class="body"><div class="meta"><b>${esc(name)}</b>${esc(time)}</div><div class="txt">${esc(text)}</div><div class="reply">Reply</div></div>
        <div class="like">${heartSvg}${likes}</div></div>`;
    const screen = document.getElementById("screen");
    screen.innerHTML = `<div class="grab"></div><div class="title">Comments</div>` +
      `<div class="c new" id="mine"><div class="av" style="background:${v.accent}">${esc(v.you[0].toUpperCase())}</div>
        <div class="body"><div class="meta"><b>${esc(v.you)}</b>Just now</div><div class="txt" style="font-weight:600">${esc(KW)}</div><div class="reply">Reply</div></div>
        <div class="like" id="mylike">${heartSvg}</div></div>` +
      `<div class="replyrow" id="authreply"><div class="av" style="background:linear-gradient(135deg,#f58529,#dd2a7b,#8134af)">${esc(v.handle[0].toUpperCase())}</div>
        <div class="body"><div class="meta"><b>${esc(v.handle)}</b>Just now<span class="author">· Author</span></div><div class="txt">${esc(v.reply)}</div><div class="reply">Reply</div></div></div>` +
      `<div class="c"><div class="av" style="background:linear-gradient(135deg,#f58529,#dd2a7b,#8134af)">${esc(v.handle[0].toUpperCase())}</div>
        <div class="body"><div class="meta"><b>${esc(v.handle)}</b>2h<span class="author">· Author</span></div><div class="txt">Comment "${esc(KW)}" and I'll send it to you 📩</div><div class="reply">Reply · 📌 Pinned</div></div>
        <div class="like">${heartSvg}1.2K</div></div>` +
      people.map(p => row(...p)).join("");

    // Dock (emoji bar + input) and keyboard, positioned against the visible frame.
    const frame = document.getElementById("frame");
    const fh = frame.getBoundingClientRect().height || H * 0.96;
    const dock = document.createElement("div");
    dock.className = "dock";
    dock.innerHTML = `<div class="emoji">❤️ 🙌 🔥 👏 😢 😍 😮 😂</div>
      <div class="input"><div class="av" style="width:84px;height:84px;font-size:34px;background:${v.accent}">${esc(v.you[0].toUpperCase())}</div>
      <div class="field"><span id="ph">Add a comment for ${esc(v.handle)}…</span><span class="typed" id="typed"></span><span class="caret" id="caret"></span></div>
      <span class="post" id="post" style="color:${v.accent}">Post</span></div>`;
    frame.appendChild(dock);
    const kb = document.createElement("div");
    kb.className = "kb";
    const rows = ["QWERTYUIOP", "ASDFGHJKL", "ZXCVBNM"];
    kb.innerHTML = rows.map((r, i) => `<div class="kr">${i === 2 ? '<div class="k wide">⇧</div>' : ""}${[...r].map(ch => `<div class="k" data-k="${ch}">${ch.toLowerCase()}<div class="pop">${ch.toLowerCase()}</div></div>`).join("")}${i === 2 ? '<div class="k wide">⌫</div>' : ""}</div>`).join("") +
      `<div class="kr"><div class="k wide">123</div><div class="k wide">😊</div><div class="k space">space</div><div class="k ret">return</div></div>`;
    frame.appendChild(kb);
    const kbH = kb.getBoundingClientRect().height || 620;
    const dockH = dock.getBoundingClientRect().height || 260;
    dock.style.bottom = "0px";
    kb.style.top = fh - kbH + "px";
    const keys = {};
    kb.querySelectorAll(".k").forEach(el => { if (el.dataset.k) keys[el.dataset.k] = el; });
    gsap.set(kb, { y: kbH });

    const tl = gsap.timeline({ paused: true });
    const k = D / 4;
    tl.fromTo(frame, { opacity: 0, y: 120 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0);
    tl.from(".c", { opacity: 0, y: 20, duration: 0.25, stagger: 0.04 }, 0.15);
    // Tap the field: keyboard slides up, dock rides on top of it, list scrolls.
    tl.to(kb, { y: 0, duration: 0.3 * k, ease: "power3.out" }, 0.95 * k);
    tl.to(dock, { y: -kbH, duration: 0.3 * k, ease: "power3.out" }, 0.95 * k);
    tl.to(screen, { y: -Math.max(0, kbH * 0.75), duration: 0.3 * k, ease: "power3.out" }, 0.95 * k);
    tl.set("#ph", { display: "none" }, 1.15 * k);
    tl.set("#caret", { opacity: 1 }, 1.15 * k);
    const letters = [...KW].filter(ch => /[A-Z]/.test(ch));
    const typed = document.getElementById("typed");
    letters.forEach((ch, i) => {
      const t = (1.25 + i * 0.14) * k;
      const key = keys[ch];
      if (key) {
        const pop = key.querySelector(".pop");
        tl.set(pop, { opacity: 1 }, t);
        tl.set(pop, { opacity: 0 }, t + 0.12 * k);
      }
      tl.call(() => { typed.textContent = KW.slice(0, i + 1); }, null, t);
      tl.set(typed, { textContent: KW.slice(0, i + 1) }, t);
    });
    const done = (1.3 + letters.length * 0.14) * k;
    tl.to("#post", { opacity: 1, duration: 0.08 }, 1.25 * k);
    tl.to("#post", { scale: 1.2, duration: 0.07, yoyo: true, repeat: 1 }, done);
    // Post: keyboard drops, field clears, the comment lands at the top with a heart.
    tl.set(typed, { textContent: "" }, done + 0.12);
    tl.set("#caret", { opacity: 0 }, done + 0.12);
    tl.set("#ph", { display: "inline" }, done + 0.12);
    tl.to(kb, { y: kbH, duration: 0.28 * k, ease: "power2.in" }, done + 0.1);
    tl.to(dock, { y: 0, duration: 0.28 * k, ease: "power2.in" }, done + 0.1);
    tl.to(screen, { y: 0, duration: 0.3 * k, ease: "power2.out" }, done + 0.15);
    tl.to("#mine", { opacity: 1, height: "auto", duration: 0.3, ease: "power2.out" }, done + 0.2);
    // The author replies under the comment, then the DM arrives: what really happens next.
    tl.to("#authreply", { opacity: 1, height: "auto", duration: 0.3, ease: "power2.out" }, done + 0.3);
    const banner = document.getElementById("banner");
    document.getElementById("bav").textContent = v.handle[0].toUpperCase();
    document.getElementById("bapp").innerHTML = `<b style="color:#fff">${esc(v.handle)}</b> · now`;
    document.getElementById("bmsg").textContent = v.dm;
    tl.fromTo(banner, { opacity: 0, y: -160 }, { opacity: 1, y: 0, duration: 0.35, ease: "back.out(1.6)" }, done + 0.7);
    tl.to([frame, banner], { opacity: 0, y: 60, duration: 0.25, ease: "power2.in" }, D - 0.25);
    window.__timelines = window.__timelines || {};
    window.__timelines["root"] = tl;
  </script>
</div>
</body>
</html>
