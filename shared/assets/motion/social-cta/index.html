<!doctype html>
<!-- Social CTA: a generic comment sheet. The keyword the speaker asks for ("comment
     SKILL") is typed into the box and posted. Use on any comment/DM call to action. -->
<html data-composition-variables='[
  {"id":"keyword","type":"string","label":"Keyword to type","default":"SKILL"},
  {"id":"handle","type":"string","label":"Creator handle","default":"@yourhandle"},
  {"id":"accent","type":"color","label":"Accent","default":"#3b82f6"},
  {"id":"centerY","type":"number","label":"Vertical centre, % of height","default":60}
]'>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; }
  #root { position: relative; overflow: hidden; font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; }
  .sheet { position: absolute; left: 17%; width: 66%; border-radius: 34px; background: #121212; color: #f5f5f5; opacity: 0;
           box-shadow: 0 40px 90px rgba(0,0,0,.55); padding: 26px 30px 30px; box-sizing: border-box; }
  .grab { width: 70px; height: 7px; border-radius: 4px; background: #444; margin: 0 auto 18px; }
  .hd { text-align: center; font-weight: 700; font-size: 30px; margin-bottom: 22px; }
  .c { display: flex; gap: 16px; margin-bottom: 20px; align-items: flex-start; font-size: 26px; }
  .av { width: 54px; height: 54px; border-radius: 50%; flex: none; }
  .u { color: #a3a3a3; font-size: 22px; font-weight: 600; }
  .new { opacity: 0; }
  .input { display: flex; align-items: center; gap: 14px; border: 2px solid #333; border-radius: 999px; padding: 14px 18px; font-size: 28px; margin-top: 8px; }
  .typed { flex: 1; font-weight: 700; }
  .send { font-weight: 800; }
  .cursor { position: absolute; left: 0; top: 0; width: 46px; opacity: 0; filter: drop-shadow(0 4px 6px rgba(0,0,0,.5)); }
  .heart { position: absolute; font-size: 54px; opacity: 0; }
</style>
</head>
<body>
<div id="root" data-composition-id="root" data-width="{{WIDTH}}" data-height="{{HEIGHT}}" data-start="0" data-duration="{{DURATION}}">
  <div class="sheet clip" id="sheet" data-start="0" data-duration="{{DURATION}}">
    <div class="grab"></div>
    <div class="hd">Comments</div>
    <div class="c"><div class="av" style="background:#f59e0b"></div><div><div class="u">maya.creates</div>this is exactly what I needed</div></div>
    <div class="c"><div class="av" style="background:#10b981"></div><div><div class="u">devon_edits</div>wait it does captions too??</div></div>
    <div class="c new" id="new"><div class="av" id="myav"></div><div><div class="u">you</div><b id="posted"></b></div></div>
    <div class="input"><span class="typed" id="typed"></span><span class="send" id="send">Post</span></div>
  </div>
  <div class="heart" id="heart">❤️</div>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
  <script>
    const v = window.__hyperframes.getVariables();
    const W = {{WIDTH}}, H = {{HEIGHT}}, D = {{DURATION}};
    const sheet = document.getElementById("sheet");
    sheet.style.top = (H * v.centerY / 100 - 300) + "px";
    document.getElementById("send").style.color = v.accent;
    document.getElementById("myav").style.background = v.accent;
    document.getElementById("posted").textContent = v.keyword;
    const typed = document.getElementById("typed");
    const heart = document.getElementById("heart");
    heart.style.left = W * 0.74 + "px"; heart.style.top = (H * v.centerY / 100 + 40) + "px";
    const k = D / 4, typer = { n: 0 };
    const tl = gsap.timeline({ paused: true });
    tl.fromTo(sheet, { opacity: 0, y: 160 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 0);
    tl.to(typer, { n: v.keyword.length, duration: 0.6 * k, ease: "none", onUpdate: () => { typed.textContent = v.keyword.slice(0, Math.round(typer.n)); } }, 0.6 * k);
    tl.to("#send", { scale: 1.25, duration: 0.08, yoyo: true, repeat: 1 }, 1.45 * k);
    tl.add(() => {}, 1.5 * k);
    tl.set(typed, { textContent: "" }, 1.55 * k);
    tl.to("#new", { opacity: 1, duration: 0.25 }, 1.55 * k);
    tl.fromTo(heart, { opacity: 0, scale: 0.3, y: 0 }, { opacity: 1, scale: 1.2, y: -60, duration: 0.5, ease: "back.out(2)" }, 1.75 * k);
    tl.to(heart, { opacity: 0, y: -140, duration: 0.5 }, 1.75 * k + 0.6);
    tl.to(sheet, { opacity: 0, y: 80, duration: 0.3, ease: "power2.in" }, D - 0.3);
    window.__timelines = window.__timelines || {};
    window.__timelines["root"] = tl;
  </script>
</div>
</body>
</html>
