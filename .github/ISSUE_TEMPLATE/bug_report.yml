name: Bug report
description: Something went wrong with an edit or the install.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you asked for, what you got, and what you expected.
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Setup output
      description: Paste the output of `python3 ~/.claude/skills/video-edit/shared/scripts/setup.py` (or the Codex path).
      render: text
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: Agent
      options: [Claude Code (plugin), Claude Code (install.py), Codex, Other]
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and chip
      placeholder: macOS 15 on Apple Silicon, Ubuntu 24.04, ...
  - type: textarea
    id: logs
    attributes:
      label: Error or QA report
      description: The error text, or the project's qa/report.md. Please do not attach footage you are not happy to share publicly.
      render: text
